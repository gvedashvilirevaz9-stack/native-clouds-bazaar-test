<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Лила · Native Clouds</title>
<style>
  :root{--gold:#e8c56a;--gold2:#b9892f;--ink:#0b1020;--glass:rgba(10,13,24,.52);}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#05060c;font-family:'Georgia','Times New Roman',serif;color:#f3ecd8;-webkit-font-smoothing:antialiased}
  #board{position:fixed;inset:0;background:#05060c center/cover no-repeat;background-image:url('lila/board.jpg')}
  #board::after{content:'';position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 60%,transparent 55%,rgba(3,4,10,.55) 100%)}
  /* path + nodes */
  #layer{position:absolute;inset:0;pointer-events:none}
  .node{position:absolute;width:1.7%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(255,240,190,.95),rgba(255,200,90,.35) 60%,transparent 72%);box-shadow:0 0 10px rgba(255,210,120,.6)}
  .node.arrow{background:radial-gradient(circle,#fff2c0,rgba(255,196,64,.5) 60%,transparent 72%);box-shadow:0 0 16px 3px rgba(255,196,64,.8)}
  .node.snake{background:radial-gradient(circle,#bfe0ff,rgba(90,150,255,.45) 60%,transparent 72%);box-shadow:0 0 14px 2px rgba(90,150,255,.7)}
  .node.win{background:radial-gradient(circle,#fff,rgba(255,236,150,.7) 55%,transparent 72%);box-shadow:0 0 22px 5px rgba(255,236,150,.9)}
  #token{position:absolute;width:2.7%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;z-index:5;
    background:radial-gradient(circle at 38% 34%,#ffffff,#ffe9a8 30%,#f4a93a 62%,#b5661d 100%);
    box-shadow:0 0 18px 6px rgba(255,200,110,.75),0 0 46px 14px rgba(255,170,80,.35);transition:left 1s cubic-bezier(.5,0,.3,1),top 1s cubic-bezier(.5,0,.3,1)}
  #token::after{content:'';position:absolute;inset:14%;border-radius:50%;background:radial-gradient(circle at 60% 65%,transparent 40%,rgba(255,255,255,.5) 70%,transparent)}
  /* HUD + play */
  #hud{position:fixed;left:18px;top:16px;z-index:20;background:var(--glass);backdrop-filter:blur(12px);border:1px solid rgba(232,197,106,.3);border-radius:14px;padding:9px 14px;font-size:13px;letter-spacing:.02em;box-shadow:0 8px 30px rgba(0,0,0,.4)}
  #hud b{color:var(--gold)}
  #play{position:fixed;left:50%;top:2.4vh;transform:translateX(-50%);z-index:20;cursor:pointer;
    background:linear-gradient(180deg,rgba(40,30,16,.85),rgba(18,13,6,.9));border:1px solid var(--gold2);color:var(--gold);
    padding:13px 30px;border-radius:40px;font-size:17px;letter-spacing:.06em;box-shadow:0 0 0 1px rgba(232,197,106,.25),0 10px 40px rgba(0,0,0,.5);transition:transform .2s,box-shadow .2s}
  #play:hover{transform:translateX(-50%) translateY(-2px);box-shadow:0 0 24px rgba(232,197,106,.4),0 14px 46px rgba(0,0,0,.6)}
  /* modal: dark frosted casino glass */
  #scrim{position:fixed;inset:0;z-index:30;display:none;background:radial-gradient(130% 90% at 50% 40%,transparent 60%,rgba(2,3,10,.4))}
  #scrim.on{display:block}
  /* top screen: big wide drum in frosted casino glass */
  #drumPanel{position:absolute;top:3vh;left:50%;transform:translateX(-50%);width:min(900px,74vw);border-radius:24px;padding:10px clamp(12px,2vw,26px) 4px;
    background:linear-gradient(160deg,rgba(14,18,32,.6),rgba(7,9,18,.72));backdrop-filter:blur(26px) saturate(1.25);-webkit-backdrop-filter:blur(26px) saturate(1.25);
    border:1px solid rgba(232,197,106,.32);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 0 60px rgba(120,90,40,.12),0 30px 90px rgba(0,0,0,.6);
    transition:transform .5s cubic-bezier(.5,0,.2,1),opacity .4s}
  #drumPanel.lift{transform:translateX(-50%) translateY(-26vh) scale(.85);opacity:0;pointer-events:none}
  #close{position:absolute;right:16px;top:12px;width:34px;height:34px;border-radius:50%;border:1px solid rgba(232,197,106,.4);background:rgba(20,14,8,.7);color:var(--gold);font-size:17px;cursor:pointer;z-index:4}
  .mtitle{text-align:center;color:var(--gold);letter-spacing:.14em;font-size:13px;text-transform:uppercase;opacity:.8;margin:0 0 10px}
  /* bottom screen: bowl standing on the board's blue lotus */
  #bowlWrap{position:absolute;left:50%;bottom:6.5vh;transform:translateX(-50%);width:min(330px,26vw);aspect-ratio:16/9;background:url('lila/bowl.webp') center bottom/contain no-repeat;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;filter:drop-shadow(0 14px 26px rgba(0,0,0,.55))}
  #bowlWrap::before{content:'';position:absolute;left:50%;bottom:4%;transform:translateX(-50%);width:62%;height:24%;border-radius:50%;background:radial-gradient(ellipse,rgba(120,210,255,.5),transparent 70%);filter:blur(6px);z-index:-1}
  #scrim.choosing #bowlWrap{opacity:0;pointer-events:none;transition:opacity .3s}
  #scrim.carding::after{content:'';position:fixed;inset:0;background:rgba(2,3,10,.58);z-index:40;pointer-events:none}
  #dice{display:flex;gap:5px;margin-top:-28%;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
  .die{width:clamp(26px,3.4vw,42px);aspect-ratio:1;border-radius:22%;background:linear-gradient(150deg,#f7e7ad,#c89b3e);border:1px solid #7c5a1e;position:relative;box-shadow:inset 0 2px 4px rgba(255,255,255,.5),inset 0 -3px 6px rgba(90,60,10,.5)}
  .die i{position:absolute;width:19%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 35%,#3a2a08,#120c02);transform:translate(-50%,-50%)}
  .die.shake{animation:shk .28s linear infinite}
  @keyframes shk{0%{transform:translateY(0) rotate(0)}25%{transform:translateY(-14%) rotate(-12deg)}50%{transform:translateY(4%) rotate(9deg)}75%{transform:translateY(-8%) rotate(-6deg)}100%{transform:translateY(0) rotate(0)}}
  #charge{position:absolute;bottom:8%;left:50%;transform:translateX(-50%);font-size:12px;color:var(--gold);letter-spacing:.05em;opacity:.85;text-align:center;width:90%}
  #rollno{position:absolute;top:8%;left:50%;transform:translateX(-50%) scale(.4);opacity:0;font-size:clamp(34px,5vw,58px);color:#fff;text-shadow:0 0 18px rgba(255,210,120,.9);transition:transform .4s cubic-bezier(.3,1.6,.5,1),opacity .4s}
  #rollno.show{opacity:1;transform:translateX(-50%) scale(1)}
  /* drum + card */
  #drumWrap{position:relative;width:100%;aspect-ratio:16/9;background:url('lila/drum.webp') center/contain no-repeat;display:flex;align-items:center;justify-content:center;overflow:visible}
  #reel{position:absolute;left:50%;top:46.5%;transform:translate(-50%,-50%);width:15.5%;height:52%;overflow:hidden;border-radius:7px;z-index:3;box-shadow:inset 0 0 22px rgba(255,200,90,.35)}
  #strip{position:absolute;left:0;top:0;width:100%;display:flex;flex-direction:column;gap:6px;will-change:transform}
  .cback{width:100%;aspect-ratio:909/1424;border-radius:6px;flex:0 0 auto;
    background:repeating-linear-gradient(45deg,#2a1c40,#2a1c40 6px,#34234f 6px,#34234f 12px);border:1px solid var(--gold2);box-shadow:inset 0 0 0 2px rgba(232,197,106,.25)}
  /* a rendered card */
  .card{position:relative;aspect-ratio:909/1424;height:100%;background:url('lila/card-frame.webp') center/100% 100% no-repeat;container-type:size}
  .card .art{position:absolute;left:7.4%;top:7.4%;width:85.2%;height:53.6%;border-radius:1.6cqw;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#1a1226}
  .card .art .pic{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .card .art .no{position:relative;font-size:7cqw;color:rgba(255,255,255,.9);text-shadow:0 2px 10px rgba(0,0,0,.6);font-weight:bold}
  /* rubber text container: scales with the card, padded off the ornament */
  .card .txt{position:absolute;left:13%;top:62.5%;width:74%;height:32%;padding:2.6cqh 3.4cqw;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1.5cqh;text-align:center;overflow:hidden}
  .card .txt .nm{font-size:5.4cqw;font-weight:bold;color:#36270f;line-height:1.08}
  .card .txt .pr{font-size:4.3cqw;color:#463314;line-height:1.26}
  /* card stage reveal */
  /* drawn card opens near full-screen, above the bottom dock */
  #cardStage{position:fixed;left:50%;top:2.2vh;transform:translateX(-50%) scale(.25);transform-origin:top center;opacity:0;height:min(87vh,calc(100vh - 10vh));width:auto;aspect-ratio:909/1424;z-index:45;transition:transform .55s cubic-bezier(.28,1.2,.4,1),opacity .4s;cursor:pointer;pointer-events:none}
  #cardStage.show{opacity:1;transform:translateX(-50%) scale(1);pointer-events:auto}
  #cardStage .hint{position:absolute;left:0;right:0;bottom:-3vh;text-align:center;color:var(--gold);font-size:13px;letter-spacing:.04em;animation:pulse 1.4s ease-in-out infinite}
  #cardStage .spk{position:absolute;right:6%;top:3%;width:7%;aspect-ratio:1;border-radius:50%;border:1px solid rgba(232,197,106,.6);background:rgba(20,14,8,.7);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:3cqw;cursor:pointer;z-index:3}
  @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
  /* top plaque after accept */
  #plaque{position:fixed;left:50%;top:14px;transform:translateX(-50%) translateY(-120%);z-index:31;transition:transform .5s cubic-bezier(.4,0,.2,1);
    background:var(--glass);backdrop-filter:blur(16px);border:1px solid rgba(232,197,106,.4);border-radius:16px;padding:10px 20px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5);max-width:560px}
  #plaque.on{transform:translateX(-50%) translateY(0)}
  #plaque .n{color:var(--gold);font-size:16px}#plaque .p{font-size:12.5px;opacity:.85;margin-top:3px;line-height:1.3}
  /* choices fan */
  #fan{position:fixed;left:0;right:0;bottom:-80vh;z-index:31;display:flex;gap:clamp(10px,2vw,30px);justify-content:center;align-items:center;padding:0 4vw;transition:bottom .55s cubic-bezier(.4,0,.2,1)}
  #fan.on{bottom:13vh}
  .choice{position:relative;width:auto;height:min(60vh,440px);aspect-ratio:909/1424;cursor:pointer;transition:transform .25s;background:url('lila/card-frame.webp') center/100% 100% no-repeat;transform-origin:center}
  .choice:nth-child(1){transform:rotate(-6deg) translateY(10px)}
  .choice:nth-child(3){transform:rotate(6deg) translateY(10px)}
  .choice:hover{transform:translateY(-14px) scale(1.06) rotate(0)!important;z-index:3}
  .choice .tag{position:absolute;left:8%;top:8.1%;width:84%;height:51.9%;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6%}
  .choice .tag .ic{font-size:min(5vw,52px)}
  .choice .tag .k{font-size:min(1.5vw,15px);letter-spacing:.08em;text-transform:uppercase;color:#ffe9b0;text-shadow:0 1px 6px rgba(0,0,0,.7)}
  .choice .lbl{position:absolute;left:13%;top:63%;width:74%;height:33%;overflow:hidden;text-align:center;color:#3f2d12;font-size:min(1.7vw,17px);line-height:1.28;display:flex;align-items:center;justify-content:center;padding:0 2%}
  .choice .spk{position:absolute;right:8%;top:10%;width:13%;aspect-ratio:1;border-radius:50%;border:1px solid rgba(232,197,106,.6);background:rgba(20,14,8,.62);color:#ffe9b0;display:flex;align-items:center;justify-content:center;font-size:min(2.1vw,20px);cursor:pointer;z-index:4;transition:transform .15s,background .15s}
  .choice .spk:hover{transform:scale(1.12);background:rgba(40,28,12,.85)}
  /* toast */
  #toast{position:fixed;left:50%;bottom:17vh;transform:translateX(-50%) translateY(20px);z-index:40;opacity:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(26,20,10,.92),rgba(12,9,4,.95));border:1px solid rgba(232,197,106,.5);color:#f5ead0;
    padding:14px 26px;border-radius:14px;max-width:560px;text-align:center;font-size:15px;line-height:1.35;box-shadow:0 14px 50px rgba(0,0,0,.6);transition:opacity .35s,transform .35s}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  /* win */
  #win{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 40%,rgba(30,20,60,.6),rgba(2,3,10,.92));backdrop-filter:blur(8px)}
  #win.on{display:flex}#win h1{color:var(--gold);font-size:40px;letter-spacing:.1em;margin:0 0 10px;text-shadow:0 0 30px rgba(255,220,130,.6)}
  #win p{max-width:520px;opacity:.9;line-height:1.5}#win button{margin-top:22px;cursor:pointer;background:linear-gradient(180deg,rgba(40,30,16,.9),rgba(18,13,6,.95));border:1px solid var(--gold2);color:var(--gold);padding:12px 28px;border-radius:40px;font-size:16px;letter-spacing:.05em}
</style>
</head>
<body>
<div id="board"></div>
<div id="layer"><div id="token"></div></div>
<div id="hud">Клетка <b id="hcell">1</b> · <span id="hplan">Физический план</span></div>
<button id="play">▶ Войти в игру</button>

<div id="scrim">
  <div id="drumPanel">
    <button id="close">✕</button>
    <p class="mtitle" id="minstr">Зажми чашу с камнями — отпусти — и прими судьбу</p>
    <div id="drumWrap">
      <div id="reel"><div id="strip"></div></div>
    </div>
  </div>
  <div id="cardStage"></div>
  <div id="bowlWrap" title="Зажми и отпусти">
    <div id="dice"></div>
    <div id="rollno"></div>
    <div id="charge">зажми чашу…</div>
  </div>
</div>

<div id="plaque"><div class="n" id="pqN"></div><div class="p" id="pqP"></div></div>
<div id="fan"></div>
<div id="toast"></div>
<div id="win"><h1>☀ Космическое сознание</h1><p id="winTxt">Круг Сансары завершён. Фишка растворяется в Млечном Пути.</p><button id="winBtn">Начать новый цикл</button></div>

<script src="lila-board.js"></script>
<script>
const $=id=>document.getElementById(id);
const BOARD=window.LILA_BOARD, PLANS=window.LILA_PLANS;
const byId=id=>BOARD.find(c=>c.id===id);
const PLAN_HUE=[18,275,122,340,42,205,52,286]; // цвет внутренней картинки по плану

// ---- узлы: змейка 8 рядов по 9, план 1 снизу ----
const NODES=[];
for(let i=0;i<72;i++){ const row=Math.floor(i/9), col=i%9; const c=(row%2===0)?col:(8-col);
  const x=7+c*(86/8), y=86-row*(74/7); NODES.push({x,y}); }
(function drawNodes(){ const L=$('layer');
  BOARD.forEach((c,i)=>{ const d=document.createElement('div'); d.className='node'+(c.type==='arrow'?' arrow':c.type==='snake'?' snake':c.id===68?' win':'');
    d.style.left=NODES[i].x+'%'; d.style.top=NODES[i].y+'%'; d.title=c.id+'. '+c.name; L.appendChild(d); }); })();

// ---- state ----
let cur=1, started=false, busy=false;
function hud(){ $('hcell').textContent=cur; $('hplan').textContent=byId(cur).name; }
function place(){ const n=NODES[cur-1]; $('token').style.left=n.x+'%'; $('token').style.top=n.y+'%'; }
place(); hud();

// ---- dice faces ----
const PIP={1:[[50,50]],2:[[30,30],[70,70]],3:[[30,30],[50,50],[70,70]],4:[[30,30],[70,30],[30,70],[70,70]],5:[[30,30],[70,30],[50,50],[30,70],[70,70]],6:[[30,30],[70,30],[30,50],[70,50],[30,70],[70,70]]};
function face(el,n){ el.innerHTML=''; PIP[n].forEach(p=>{const i=document.createElement('i');i.style.left=p[0]+'%';i.style.top=p[1]+'%';el.appendChild(i);}); }
const DICE=[];
(function(){ const box=$('dice'); for(let k=0;k<5;k++){ const d=document.createElement('div'); d.className='die'; box.appendChild(d); DICE.push(d); face(d,(k%6)+1); } })();

// ---- audio (мягкие сигналы) ----
let AC; function tone(f,t,dur,g){ try{AC=AC||new (window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(),a=AC.createGain(); o.type=t||'sine'; o.frequency.value=f; a.gain.value=0; o.connect(a); a.connect(AC.destination); const n=AC.currentTime; a.gain.linearRampToValueAtTime(g||.06,n+.02); a.gain.exponentialRampToValueAtTime(.0001,n+(dur||.3)); o.start(n); o.stop(n+(dur||.3)); }catch(e){} }

// ---- text-to-speech (вшито в карту, вручную по кнопке) ----
let VOICES=[]; function loadVoices(){ try{VOICES=speechSynthesis.getVoices()||[]}catch(e){} }
try{ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }catch(e){}
function ruVoice(){ return VOICES.find(v=>/^ru/i.test(v.lang))||VOICES.find(v=>/russian/i.test(v.name))||null; }
function speak(t){ try{ if(!t)return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='ru-RU'; const v=ruVoice(); if(v)u.voice=v; u.rate=1; u.pitch=1; speechSynthesis.speak(u);}catch(e){} }
function stopSpeak(){ try{speechSynthesis.cancel()}catch(e){} }
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
// клики по динамику — отдельно, не выбирают карту
document.addEventListener('click',e=>{ const b=e.target.closest('.spk'); if(b){ e.stopPropagation(); e.preventDefault(); speak(b.dataset.say||''); } },true);

// ---- card render (картинка подставляется из lila/cards/<id>.jpg, если есть) ----
function renderCard(c){ const hue=PLAN_HUE[c.plan-1];
  return `<div class="card">
    <button class="spk" title="Озвучить" data-say="${esc(c.name+'. '+c.prompt)}">🔊</button>
    <div class="art" style="background:radial-gradient(circle at 50% 42%,hsl(${hue} 70% 52%),hsl(${hue} 60% 28%) 60%,hsl(${hue} 70% 12%) 100%)">
      <img class="pic" src="lila/cards/${c.id}.jpg" alt="" onerror="this.remove()">
      <div class="no">№${c.id}</div></div>
    <div class="txt"><div class="nm">${c.name}</div><div class="pr">${c.prompt}</div></div>
  </div>`; }

// ---- throw flow ----
let charging=false, chargeT=0;
function openModal(){ $('scrim').classList.add('on'); resetThrow(); }
function resetThrow(){ stopSpeak(); $('scrim').classList.remove('choosing'); $('scrim').classList.remove('carding'); $('drumPanel').classList.remove('lift'); $('cardStage').classList.remove('show'); $('cardStage').innerHTML='';
  $('rollno').classList.remove('show'); $('charge').textContent=started?'зажми чашу…':'нужна 6, чтобы воплотиться — зажми чашу…';
  $('minstr').textContent='Зажми чашу с камнями — отпусти — и прими судьбу'; }
function closeAll(){ stopSpeak(); $('cardStage').classList.remove('show'); $('scrim').classList.remove('carding'); $('scrim').classList.remove('carding'); $('scrim').classList.remove('on'); $('plaque').classList.remove('on'); $('fan').classList.remove('on'); }

$('play').onclick=openModal; $('close').onclick=closeAll;
$('scrim').onclick=e=>{ if(e.target===$('scrim')) closeAll(); };

const bowl=$('bowlWrap');
const startCharge=e=>{ if(busy)return; e.preventDefault(); charging=true; chargeT=performance.now(); DICE.forEach(d=>d.classList.add('shake')); $('charge').textContent='…бросай!'; tone(90,'triangle',.2,.05); };
const endCharge=e=>{ if(!charging||busy)return; charging=false; DICE.forEach(d=>d.classList.remove('shake')); doRoll(); };
bowl.addEventListener('pointerdown',startCharge); window.addEventListener('pointerup',endCharge);

function doRoll(){ busy=true; const r=1+Math.floor(Math.random()*6);
  DICE.forEach((d,k)=>face(d, k===2?r:1+Math.floor(Math.random()*6)));
  const rn=$('rollno'); rn.textContent=r; rn.classList.add('show'); tone(520,'sine',.25,.07); setTimeout(()=>tone(380,'sine',.3,.05),90);
  $('charge').textContent='выпало: '+r;
  setTimeout(()=>{ rn.classList.remove('show'); resolveMove(r); }, 850); }

function resolveMove(r){
  if(!started){ if(r===6){ started=true; spinTo(6); } else { toast('Выпало '+r+'. Нужна 6, чтобы сойти с клетки Рождения.'); busy=false; $('charge').textContent='ещё бросок…'; } return; }
  let t=cur+r; if(t>72) t=72-(t-72); // отскок от 72
  spinTo(t);
}

// ---- drum spin → reveal card of sector S ----
function spinTo(S){
  const strip=$('strip'); strip.innerHTML=''; const N=20; for(let i=0;i<N;i++){const b=document.createElement('div');b.className='cback';strip.appendChild(b);}
  strip.style.transition='none'; strip.style.transform='translateY(0)'; strip.offsetHeight;
  const itemH=(strip.firstChild.offsetHeight||40)+6;
  tone(140,'sawtooth',1.5,.03);
  strip.style.transition='transform 1.55s cubic-bezier(.1,.62,.08,1)';
  strip.style.transform=`translateY(${-(N-2)*itemH}px)`;
  setTimeout(()=>{ strip.innerHTML='';
    const cs=$('cardStage'); cs.innerHTML=renderCard(byId(S))+'<div class="hint">🔊 послушать · нажми карту — принять вызов</div>';
    cs.classList.add('show'); $('scrim').classList.add('carding'); tone(660,'sine',.5,.07);
    cs.onclick=()=>acceptCard(S);
  }, 1600);
}

// ---- accept → plaque + 3 choices ----
const ICON={ego:'🜨',stagnation:'∞',awareness:'✦'}, KLABEL={ego:'Эго',stagnation:'Застой',awareness:'Осознание'};
function acceptCard(S){ const c=byId(S); cur=S; hud();
  stopSpeak(); $('cardStage').classList.remove('show'); $('scrim').classList.remove('carding');
  if(c.type==='win'){ winGame(); return; }
  $('drumPanel').classList.add('lift'); $('scrim').classList.add('choosing');
  $('pqN').textContent=c.id+'. '+c.name; $('pqP').textContent=c.prompt; $('plaque').classList.add('on');
  const fan=$('fan'); fan.innerHTML='';
  const CBG={ego:'radial-gradient(circle at 50% 38%,#c0453f,#611616 62%,#2c0a0a)',stagnation:'radial-gradient(circle at 50% 38%,#7b828f,#333843 62%,#1a1d24)',awareness:'radial-gradient(circle at 50% 38%,#f0d079,#9c7320 60%,#3f2d0a)'};
  c.choices.forEach(ch=>{ const el=document.createElement('div'); el.className='choice';
    el.innerHTML=`<button class="spk" title="Озвучить" data-say="${esc(ch.label)}">🔊</button><div class="tag" style="background:${CBG[ch.id]}"><div class="ic">${ICON[ch.id]}</div><div class="k">${KLABEL[ch.id]}</div></div><div class="lbl">${ch.label}</div>`;
    el.onclick=()=>chooseFate(ch); fan.appendChild(el); });
  setTimeout(()=>fan.classList.add('on'),80); tone(440,'sine',.3,.05);
}

function chooseFate(ch){ if(busy&&!$('fan').classList.contains('on'))return;
  $('fan').classList.remove('on'); $('plaque').classList.remove('on'); closeAll();
  const target=ch.effect==='stay'?cur:ch.target;
  const up=target>cur; tone(up?300:200,'sine',.1,.05);
  setTimeout(()=>{ cur=target; place(); hud();
    const slide=up? [520,660,790] : [300,240,190]; slide.forEach((f,i)=>setTimeout(()=>tone(f,'sine',.5,.05),i*140));
    setTimeout(()=>{ toast(ch.feedback);
      if(cur===68){ setTimeout(winGame,700); } else { busy=false; } }, 900);
  }, 420);
}

function winGame(){ closeAll(); $('win').classList.add('on'); tone(523,'sine',1.2,.08); setTimeout(()=>tone(659,'sine',1.2,.08),180); setTimeout(()=>tone(784,'sine',1.6,.08),360); }
$('winBtn').onclick=()=>{ $('win').classList.remove('on'); cur=1; started=false; busy=false; place(); hud(); save(); };

// ---- toast ----
let tt; function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),3600); }

// ---- persist ----
const SK='lila.save.v1';
function save(){ try{localStorage.setItem(SK,JSON.stringify({cur,started}));}catch(e){} }
(function load(){ try{const s=JSON.parse(localStorage.getItem(SK)||'null'); if(s&&s.cur){ cur=s.cur; started=!!s.started; place(); hud(); }}catch(e){} })();
const _af=chooseFate, _wg=winGame; // hook saves
window.addEventListener('beforeunload',save);

// embed: hide nothing — board is the wallpaper, play button invites in
if(new URLSearchParams(location.search).has('embed')){ /* reserved for channel wiring later */ }
</script>
</body>
