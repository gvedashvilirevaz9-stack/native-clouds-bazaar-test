<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel-iso тест</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#1a6b8a}
#bg{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}</style></head>
<body><canvas id="bg"></canvas>
<script type="module">
import * as THREE from './vendor/three.module.min.js';
const canvas=document.getElementById('bg');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false});
const PIX=4; // render at 1/PIX resolution -> pixel-art upscale
function size(){const w=innerWidth,h=innerHeight;renderer.setPixelRatio(1);renderer.setSize(Math.ceil(w/PIX),Math.ceil(h/PIX),false);canvas.style.width=w+'px';canvas.style.height=h+'px';cam.aspect=w/h;const f=14;cam.left=-f*w/h;cam.right=f*w/h;cam.top=f;cam.bottom=-f;cam.updateProjectionMatrix();}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x3aa0c4);
// orthographic isometric camera (map seen from above + side)
const cam=new THREE.OrthographicCamera(-20,20,14,-14,0.1,500);
cam.position.set(26,24,26);cam.lookAt(0,0,0);
scene.add(new THREE.AmbientLight(0xffffff,0.75));
const dir=new THREE.DirectionalLight(0xfff0d0,1.0);dir.position.set(20,30,10);scene.add(dir);
scene.add(new THREE.HemisphereLight(0xcfeeff,0x6b8f4a,0.5));

// ---- pixel texture maker (small canvas, nearest filter) ----
function tex(sz,draw){const c=document.createElement('canvas');c.width=c.height=sz;const g=c.getContext('2d');draw(g,sz);const t=new THREE.CanvasTexture(c);t.magFilter=THREE.NearestFilter;t.minFilter=THREE.NearestFilter;t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;}
const rnd=(a,b)=>a+Math.random()*(b-a);
function speckle(g,sz,base,cols,density){g.fillStyle=base;g.fillRect(0,0,sz,sz);for(let i=0;i<sz*sz*density;i++){g.fillStyle=cols[Math.random()*cols.length|0];const x=Math.random()*sz|0,y=Math.random()*sz|0;g.fillRect(x,y,1,1);}}
const water=tex(16,(g,s)=>{speckle(g,s,'#2aa7cc',['#2399bd','#3bb6d8','#1f8fb0'],0.5);for(let i=0;i<10;i++){g.fillStyle='#bfefff';g.fillRect(Math.random()*s|0,Math.random()*s|0,Math.random()<.5?2:1,1);}});
water.repeat.set(24,24);
const sand=tex(16,(g,s)=>speckle(g,s,'#efdca6',['#e7cf93','#f6e7bb','#d8bd82'],0.35));sand.repeat.set(6,6);
const grass=tex(16,(g,s)=>speckle(g,s,'#6fc04a',['#64b23f','#80cf5a','#55a035'],0.4));grass.repeat.set(5,5);
const wood=tex(16,(g,s)=>{speckle(g,s,'#b07a44','#9c6a39'.split(),0.1);g.fillStyle='#9c6a39';for(let y=0;y<s;y+=4)g.fillRect(0,y,s,1);for(let i=0;i<20;i++){g.fillStyle=Math.random()<.5?'#c48a52':'#8a5c30';g.fillRect(Math.random()*s|0,Math.random()*s|0,1,1);}});
const roofA=tex(16,(g,s)=>{g.fillStyle='#d84f3a';g.fillRect(0,0,s,s);g.fillStyle='#b83f2d';for(let y=0;y<s;y+=3)for(let x=(y/3%2)*2;x<s;x+=4)g.fillRect(x,y,2,2);});
const pm=(t)=>new THREE.MeshStandardMaterial({map:t,roughness:1,flatShading:false});

// ---- water plane ----
const sea=new THREE.Mesh(new THREE.PlaneGeometry(120,120),new THREE.MeshStandardMaterial({map:water,roughness:0.6,metalness:0.05}));
sea.rotation.x=-Math.PI/2;sea.position.y=-0.2;scene.add(sea);

// ---- blocky island from a tile grid (chunky pixel land) ----
const island=new THREE.Group();scene.add(island);
const N=11,TILE=2.2;
function isLand(ix,iz){const dx=ix-(N-1)/2,dz=iz-(N-1)/2;const d=Math.sqrt(dx*dx+dz*dz);return d< (N/2-0.3) - Math.random()*1.2;}
const grid=[];
for(let ix=0;ix<N;ix++){grid[ix]=[];for(let iz=0;iz<N;iz++){const land=isLand(ix,iz);grid[ix][iz]=land;if(!land)continue;const x=(ix-(N-1)/2)*TILE,z=(iz-(N-1)/2)*TILE;
  const dx=ix-(N-1)/2,dz=iz-(N-1)/2;const d=Math.sqrt(dx*dx+dz*dz);const edge=d>N/2-1.8;
  const h=edge?0.9:1.3;const block=new THREE.Mesh(new THREE.BoxGeometry(TILE,h,TILE),pm(edge?sand:grass));
  block.position.set(x,h/2,z);island.add(block);
  // sand underside cliff
  const cliff=new THREE.Mesh(new THREE.BoxGeometry(TILE,2.4,TILE),pm(sand));cliff.position.set(x,-1.2,z);island.add(cliff);
}}
// tapering underside point
const under=new THREE.Mesh(new THREE.ConeGeometry(N*TILE*0.42,N*TILE*0.7,6),new THREE.MeshStandardMaterial({color:0xd8bd82,roughness:1,flatShading:true}));
under.position.y=-2.4-N*TILE*0.35;island.add(under);

// ---- props ----
function house(x,z){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.BoxGeometry(2.2,2,2.2),pm(wood));b.position.y=2.3;g.add(b);
  const r=new THREE.Mesh(new THREE.ConeGeometry(1.9,1.4,4),pm(roofA));r.position.y=4;r.rotation.y=Math.PI/4;g.add(r);g.position.set(x,0,z);g.rotation.y=Math.random()*6.28;island.add(g);}
function palm(x,z){const g=new THREE.Group();const t=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.3,2.6,5),new THREE.MeshStandardMaterial({color:0xa9743f,roughness:1,flatShading:true}));t.position.y=2.6;g.add(t);
  for(let i=0;i<6;i++){const l=new THREE.Mesh(new THREE.ConeGeometry(0.4,1.8,4),new THREE.MeshStandardMaterial({color:i%2?0x3c8a44:0x4fae53,roughness:1,flatShading:true}));l.position.y=3.9;l.rotation.z=Math.PI/2.4;l.rotation.y=i/6*6.28;l.position.x=Math.cos(i/6*6.28)*0.7;l.position.z=Math.sin(i/6*6.28)*0.7;g.add(l);}g.position.set(x,1.3,z);island.add(g);}
house(-2,0);house(3,-2);house(0,4);palm(-5,-4);palm(5,4);palm(-4,5);palm(6,-5);
// ship
const ship=new THREE.Group();const hull=new THREE.Mesh(new THREE.BoxGeometry(1.2,0.9,3),pm(wood));hull.position.y=0.4;ship.add(hull);
const mast=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,3,5),new THREE.MeshStandardMaterial({color:0x7c5230}));mast.position.y=2;ship.add(mast);
const sail=new THREE.Mesh(new THREE.PlaneGeometry(1.6,1.8),new THREE.MeshStandardMaterial({color:0xf6efe0,side:THREE.DoubleSide,roughness:1}));sail.position.y=2;ship.add(sail);
const flag=new THREE.Mesh(new THREE.PlaneGeometry(0.6,0.35),new THREE.MeshStandardMaterial({color:0xd84f3a,side:THREE.DoubleSide}));flag.position.set(0,3.4,0);ship.add(flag);
ship.position.set(-15,0,12);ship.rotation.y=0.7;scene.add(ship);

size();addEventListener('resize',size);
let t=0;function loop(){requestAnimationFrame(loop);t+=0.016;water.offset.x=t*0.01;water.offset.y=t*0.006;ship.position.y=Math.sin(t*1.5)*0.1;renderer.render(scene,cam);}loop();
window.__ready=true;
</script></body></html>
