<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Воксельный остров · Native Clouds</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1f68b4;font-family:Inter,system-ui,sans-serif}
  #bg{position:fixed;inset:0;width:100%;height:100%;display:block}
  .panel{position:fixed;z-index:10;top:16px;right:16px;width:300px;max-height:calc(100% - 32px);overflow:auto;scrollbar-width:none;padding:14px;border-radius:20px;background:rgba(255,255,255,.5);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.6);box-shadow:0 10px 40px rgba(15,23,42,.2);font-size:13px;color:#0f172a;transition:transform .3s}
  .panel.min{transform:translateX(calc(100% + 24px))}
  .panel h1{font-size:15px;margin:0 0 2px}.sub{color:#475569;font-size:12px;margin-bottom:8px}
  .sec{margin:12px 0 0}.sec>b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#64748b;margin-bottom:6px}
  .seg{display:flex;flex-wrap:wrap;gap:4px}
  .seg button,.btn{border:1px solid rgba(15,23,42,.08);background:rgba(255,255,255,.6);border-radius:10px;padding:6px 10px;font:inherit;cursor:pointer;color:#0f172a}
  .seg button[aria-pressed=true]{background:#0f172a;color:#fff}
  .row{display:flex;gap:6px;align-items:center;margin-top:6px}.row input[type=text]{flex:1;min-width:0;border:1px solid rgba(15,23,42,.1);border-radius:10px;padding:6px 9px;font:inherit}
  input[type=range]{width:100%}.note{font-size:12px;color:#475569;margin-top:4px}
  .fab{position:fixed;z-index:10;top:16px;right:16px;width:42px;height:42px;border-radius:14px;border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.5);backdrop-filter:blur(14px);cursor:pointer;font-size:18px;display:none}
  .panel.min~.fab{display:block}
</style></head>
<body>
<canvas id="bg"></canvas>
<div class="panel" id="panel">
  <div class="row" style="justify-content:space-between;margin:0"><h1>Воксельный остров</h1><button class="btn" id="hide">→</button></div>
  <div class="sub">Тащи мышью — вращать, колесо — зум</div>
  <div class="sec"><b>Вид</b><div class="seg" id="view"><button data-v="iso">Изометрия</button><button data-v="top">Сверху</button><button data-v="side">Сбоку</button><button data-v="rot">Вращать</button></div>
    <div class="row"><div class="seg" id="mode"><button data-v="flat">∞ Доска</button><button data-v="sea">∞ Бесконечное море</button></div></div></div>
  <div class="sec"><b>Блики на воде</b><div class="seg" id="spark"><button data-v="toggle" aria-pressed="true">Блики</button><button data-v="blink" aria-pressed="true">Моргание</button></div></div>
  <div class="sec"><b>Погода</b><div class="seg" id="weather">
    <button data-v="live">Живая</button><button data-v="clear">Ясно</button><button data-v="partly">Облачно</button>
    <button data-v="rain">Дождь</button><button data-v="storm">Гроза</button><button data-v="snow">Снег</button></div>
    <div class="row"><input type="text" id="city" placeholder="Город, напр. Batumi"><button class="btn" id="cityGo">OK</button></div>
    <div class="note" id="wNote"></div></div>
  <div class="sec"><b>Время суток</b><div class="seg" id="time"><button data-v="live">Живое</button><button data-v="fixed">Вручную</button><button data-v="lapse">Ускорить</button></div>
    <input type="range" id="hour" min="0" max="24" step="0.05" value="12"><div class="note" id="tNote"></div></div>
  <div class="sec"><b>Доставка (кто несёт)</b>
    <div class="seg" id="quick"><button data-w="clock">Часы</button><button data-q="погода">Погода</button><button data-q="курс биткоина">Биткоин</button></div>
    <div class="row"><span>Несёт</span><div class="seg" id="by"><button data-v="airship">Корабль</button><button data-v="eagle">Попугай</button></div></div>
  </div>
</div>
<button class="fab" id="show">☰</button>
<script type="module">
import { createVoxelIsland } from './voxel-island.js';
import { attachWidgets } from './widgets.js';
const $=(id)=>document.getElementById(id);
const bg=createVoxelIsland($('bg'),{ view:'iso' }); window.LiveBG=bg;
const widgets=attachWidgets(bg); window.LiveWidgets=widgets;
function seg(id,v){ $(id).querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===v))); }
let wMode='live'; seg('weather','live');
$('weather').onclick=e=>{const v=e.target.dataset.v;if(!v)return;wMode=v;bg.setWeather(v);seg('weather',v);};
$('cityGo').onclick=async()=>{const v=$('city').value.trim();if(!v)return;try{await bg.setLocation(v);bg.setWeather('live');seg('weather','live');}catch(e){$('wNote').textContent=e.message;}};
bg.on('weather',w=>{ if(w.error){$('wNote').textContent='Погода: '+w.error;return;} if(w.temp!=null)$('wNote').textContent=`${bg.getWeather().location.name}: ${Math.round(w.temp)}°, облачность ${Math.round(w.cloud*100)}%`; });
let tMode='live'; seg('time','live');
const fmt=h=>`${String(Math.floor(h)).padStart(2,'0')}:${String(Math.floor((h%1)*60)).padStart(2,'0')}`;
$('time').onclick=e=>{const v=e.target.dataset.v;if(!v)return;tMode=v;seg('time',v);if(v==='live')bg.setTime(null);else bg.setTime(+$('hour').value,v==='lapse'?3600*1.2:0);};
$('hour').oninput=e=>{if(tMode==='live'){tMode='fixed';seg('time','fixed');}bg.setTime(+e.target.value,tMode==='lapse'?3600*1.2:0);};
setInterval(()=>{const t=bg.getTime();if(tMode!=='fixed')$('hour').value=t.hour;$('tNote').textContent=`Сейчас ${fmt(t.hour)} · восход ${fmt(t.sunrise)} · закат ${fmt(t.sunset)}`;},300);
let by='airship'; seg('by','airship');
let rot=false; seg('view','iso');
$('view').onclick=e=>{const v=e.target.dataset.v;if(!v)return;if(v==='rot'){rot=!rot;bg.setAutoRotate(rot);e.target.setAttribute('aria-pressed',String(rot));return;}bg.setView(v);$('view').querySelectorAll('button').forEach(b=>{if(b.dataset.v!=='rot')b.setAttribute('aria-pressed',String(b.dataset.v===v));});}; $('by').onclick=e=>{const v=e.target.dataset.v;if(v){by=v;seg('by',v);}};
let inf=false,sea=false; $('mode').onclick=e=>{const v=e.target.dataset.v; if(v==='flat'){inf=bg.setInfinite();sea=false;} else if(v==='sea'){sea=bg.setInfiniteSea();inf=false;} else return;
  $('mode').querySelector('[data-v=flat]').setAttribute('aria-pressed',String(inf));
  $('mode').querySelector('[data-v=sea]').setAttribute('aria-pressed',String(sea));};
let spk=true,blk=true; $('spark').onclick=e=>{const v=e.target.dataset.v;
  if(v==='toggle') spk=bg.setSpecks(); else if(v==='blink') blk=bg.setBlink(); else return;
  $('spark').querySelector('[data-v=toggle]').setAttribute('aria-pressed',String(spk));
  $('spark').querySelector('[data-v=blink]').setAttribute('aria-pressed',String(blk));};
$('quick').onclick=e=>{const b=e.target.closest('button');if(!b)return;b.dataset.w?bg.deliver(b.dataset.w,{by,size:'M'}):bg.deliver('agent',{by,size:'M',data:{q:b.dataset.q}});};
$('hide').onclick=()=>$('panel').classList.add('min'); $('show').onclick=()=>$('panel').classList.remove('min');

// ---- clickable marker cubes: left-click runs, right-click configures (ribbon + All catalog) ----
const MK='lw.markers.v1';
const mkCfg=(()=>{try{return JSON.parse(localStorage.getItem(MK)||'{}')}catch{return{}}})();
const saveMk=()=>{try{localStorage.setItem(MK,JSON.stringify(mkCfg))}catch{}};
const CATALOG=[
 {id:'clock',label:'Часы',kind:'clock'},
 {id:'weather',label:'Погода',kind:'weather'},
 {id:'btc',label:'Биткоин',kind:'agent',q:'курс биткоина'},
 {id:'eth',label:'Эфириум',kind:'agent',q:'курс эфириума'},
 {id:'sol',label:'Solana',kind:'agent',q:'курс solana'},
 {id:'ton',label:'TON',kind:'agent',q:'курс toncoin'},
 {id:'usdgel',label:'USD/GEL',kind:'agent',q:'курс доллара к лари'},
 {id:'eur',label:'Евро',kind:'agent',q:'курс евро к доллару'},
 {id:'gold',label:'Золото',kind:'agent',q:'цена золота за унцию'},
 {id:'oil',label:'Нефть',kind:'agent',q:'цена нефти Brent'},
 {id:'sp500',label:'S&P 500',kind:'agent',q:'индекс S&P 500'},
 {id:'nasdaq',label:'Nasdaq',kind:'agent',q:'индекс Nasdaq'},
 {id:'news',label:'Новости',kind:'agent',q:'главные новости сегодня'},
 {id:'custom',label:'Своё…',kind:'custom'},
];
const DEFAULTS={m1:'btc',m2:'eth',m3:'weather',m4:'clock',m5:'usdgel',m6:'gold',m7:'news'};
const fromCat=(cid,by='airship')=>{const c=CATALOG.find(x=>x.id===cid);if(!c||c.kind==='custom')return null;return {label:c.label,kind:c.kind,q:c.q,by,cat:c.id};};
for(const mk of bg.getMarkers()){ if(!mkCfg[mk.id]&&DEFAULTS[mk.id]){const d=fromCat(DEFAULTS[mk.id]); if(d)mkCfg[mk.id]=d;} }
saveMk();
const runCfg=cfg=>{ if(!cfg)return; cfg.kind==='agent'?bg.deliver('agent',{by:cfg.by||'airship',size:'M',data:{q:cfg.q}}):bg.deliver(cfg.kind,{by:cfg.by||'airship',size:'M'}); };
const mkStyle=document.createElement('style'); mkStyle.textContent=`
.mktip{position:fixed;z-index:30;pointer-events:none;padding:8px 12px;border-radius:12px;font:13px Inter,system-ui,sans-serif;color:#fff;
  background:rgba(20,30,48,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.35);
  box-shadow:0 8px 28px rgba(8,18,36,.35);transform:translate(-50%,-130%);white-space:nowrap}
.mkpop{position:fixed;z-index:31;width:290px;padding:13px;border-radius:16px;font:13px Inter,system-ui,sans-serif;color:#0f172a;
  background:rgba(255,255,255,.74);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.7);
  box-shadow:0 14px 44px rgba(15,23,42,.28);transform:translateX(-50%)}
.mkhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.mkhead b{font-size:13px}
.mkallb{border:1px solid rgba(15,23,42,.14);background:rgba(15,23,42,.06);border-radius:8px;padding:4px 11px;font:inherit;font-weight:600;cursor:pointer;color:#0f172a}
.mkallb:hover{background:#0f172a;color:#fff}
.mkribbon{display:flex;align-items:center;gap:4px;margin-bottom:9px}
.mkarr{flex:0 0 26px;border:none;background:rgba(15,23,42,.08);border-radius:8px;height:30px;cursor:pointer;font-size:12px;color:#0f172a}
.mkarr:hover{background:rgba(15,23,42,.18)}
.mktrack{display:flex;gap:4px;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:none;flex:1}.mktrack::-webkit-scrollbar{display:none}
.mkchip{flex:0 0 auto;border:1px solid rgba(15,23,42,.12);background:rgba(255,255,255,.6);border-radius:9px;padding:6px 11px;font:inherit;cursor:pointer;color:#0f172a;white-space:nowrap}
.mkchip.on{background:#0f172a;color:#fff;border-color:#0f172a}
.mkq{width:100%;box-sizing:border-box;border:1px solid rgba(15,23,42,.14);border-radius:9px;padding:6px 9px;font:inherit;margin-bottom:9px}
.mkseg{display:flex;gap:4px;margin-bottom:9px}
.mkseg button{flex:1;border:1px solid rgba(15,23,42,.1);background:rgba(255,255,255,.6);border-radius:9px;padding:6px;font:inherit;cursor:pointer;color:#0f172a}
.mkseg button[aria-pressed=true]{background:#0f172a;color:#fff}
.mkfoot{display:flex;justify-content:space-between;align-items:center}.mkcur{font-size:12px;opacity:.72}
.mkx{border:none;background:rgba(15,23,42,.1);border-radius:8px;width:30px;height:28px;cursor:pointer;font-size:13px;color:#0f172a}
.mkall{position:fixed;z-index:32;width:234px;max-height:320px;padding:12px;border-radius:16px;font:13px Inter,system-ui,sans-serif;color:#0f172a;
  background:rgba(255,255,255,.84);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.75);
  box-shadow:0 16px 48px rgba(15,23,42,.3);transform:translateX(-50%);display:flex;flex-direction:column}
.mklist{overflow-y:auto;display:flex;flex-direction:column;gap:3px;margin-top:6px}
.mklist button{text-align:left;border:1px solid rgba(15,23,42,.08);background:rgba(255,255,255,.5);border-radius:8px;padding:7px 10px;font:inherit;cursor:pointer;color:#0f172a}
.mklist button:hover{background:#0f172a;color:#fff}`;
document.head.append(mkStyle);
let tip=null;
bg.on('markerHover',h=>{ if(!h.id){if(tip){tip.remove();tip=null;}return;} const c=mkCfg[h.id];
  if(!tip){tip=document.createElement('div');tip.className='mktip';document.body.append(tip);}
  tip.innerHTML=c?`<b>${c.label}</b> · клик — запуск`:'Пусто · правый клик — выбрать';
  tip.style.left=h.screen[0]+'px'; tip.style.top=(h.screen[1]-14)+'px'; });
let hintEl=null,hintT=null;
const showHint=(m,txt)=>{ if(tip){tip.remove();tip=null;} if(hintEl)hintEl.remove(); clearTimeout(hintT);
  hintEl=document.createElement('div'); hintEl.className='mktip'; hintEl.textContent=txt;
  hintEl.style.left=m.screen[0]+'px'; hintEl.style.top=(m.screen[1]-14)+'px'; document.body.append(hintEl);
  hintT=setTimeout(()=>{if(hintEl){hintEl.remove();hintEl=null;}},2800); };
let pop=null,allEl=null;
const closeMenus=()=>{ if(pop){pop.remove();pop=null;} if(allEl){allEl.remove();allEl=null;} };
bg.on('marker',m=>{ if(tip){tip.remove();tip=null;}
  if(m.button==='right'){ openMenu(m); return; }
  closeMenus();
  const cfg=mkCfg[m.id];
  if(cfg&&(cfg.kind==='clock'||cfg.kind==='weather'||(cfg.kind==='agent'&&cfg.q))) runCfg(cfg);
  else showHint(m,'Пусто — правый клик мышки, выбери функцию'); });
function openMenu(m){
  closeMenus();
  const cfg=mkCfg[m.id]||{by:'airship'}; let cby=cfg.by||'airship';
  pop=document.createElement('div'); pop.className='mkpop';
  pop.style.left=Math.max(152,Math.min(m.screen[0],innerWidth-152))+'px';
  pop.innerHTML=`<div class="mkhead"><b>Кубик #${m.id.replace('m','')} · ${m.kind==='palm'?'пальма':'флаг'}</b><button class="mkallb">Все</button></div>
    <div class="mkribbon"><button class="mkarr" data-d="-1">◀</button><div class="mktrack"></div><button class="mkarr" data-d="1">▶</button></div>
    <input class="mkq" placeholder="Свой запрос…" style="display:none">
    <div class="mkseg mkby"><button data-b="airship">Корабль</button><button data-b="eagle">Попугай</button></div>
    <div class="mkfoot"><span class="mkcur"></span><button class="mkx">✕</button></div>`;
  document.body.append(pop);
  { const r=pop.getBoundingClientRect(); let top=m.screen[1]-r.height-14; if(top<8)top=m.screen[1]+18; pop.style.top=Math.max(8,Math.min(top,innerHeight-r.height-8))+'px'; }
  const track=pop.querySelector('.mktrack'), qIn=pop.querySelector('.mkq');
  const curCat=()=>{ const c=mkCfg[m.id]; return c?(c.cat||(c.kind==='agent'?'custom':c.kind)):null; };
  const updFoot=()=>{ const c=mkCfg[m.id]; pop.querySelector('.mkcur').textContent=c?('▶ '+c.label):'пусто'; };
  const paintBy=()=>pop.querySelectorAll('.mkby button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.b===cby)));
  const renderChips=()=>{ track.innerHTML=''; CATALOG.forEach(c=>{ const btn=document.createElement('button'); btn.className='mkchip'+(curCat()===c.id?' on':''); btn.textContent=c.label; btn.onclick=()=>pick(c); track.append(btn); });
    const on=track.querySelector('.mkchip.on'); if(on) on.scrollIntoView({inline:'center',block:'nearest'}); };
  function pick(c){ if(c.kind==='custom'){ qIn.style.display='block'; qIn.focus(); return; }
    mkCfg[m.id]={label:c.label,kind:c.kind,q:c.q,by:cby,cat:c.id}; saveMk(); renderChips(); updFoot(); }
  qIn.onchange=()=>{ const q=qIn.value.trim(); if(q){ mkCfg[m.id]={label:q,kind:'agent',q,by:cby}; saveMk(); renderChips(); updFoot(); } };
  pop.querySelector('.mkby').onclick=e=>{ const x=e.target.closest('button'); if(!x)return; cby=x.dataset.b; if(mkCfg[m.id]){mkCfg[m.id].by=cby;saveMk();} paintBy(); };
  pop.querySelectorAll('.mkarr').forEach(ar=>ar.onclick=()=>track.scrollBy({left:(+ar.dataset.d)*150,behavior:'smooth'}));
  pop.querySelector('.mkallb').onclick=()=>openAll(m,()=>{renderChips();updFoot();});
  pop.querySelector('.mkx').onclick=closeMenus;
  const c0=mkCfg[m.id]; if(c0&&c0.kind==='agent'&&!c0.cat){ qIn.style.display='block'; qIn.value=c0.q||''; }
  renderChips(); updFoot(); paintBy();
}
function openAll(m,after){
  if(allEl)allEl.remove();
  allEl=document.createElement('div'); allEl.className='mkall';
  allEl.style.left=pop?pop.style.left:(innerWidth/2+'px'); allEl.style.top=pop?pop.style.top:'110px';
  allEl.innerHTML=`<div class="mkhead"><b>Все команды</b><button class="mkx">✕</button></div><div class="mklist"></div>`;
  const list=allEl.querySelector('.mklist');
  CATALOG.filter(c=>c.kind!=='custom').forEach(c=>{ const bt=document.createElement('button'); bt.textContent=c.label;
    bt.onclick=()=>{ mkCfg[m.id]={label:c.label,kind:c.kind,q:c.q,by:(mkCfg[m.id]&&mkCfg[m.id].by)||'airship',cat:c.id}; saveMk(); allEl.remove();allEl=null; after&&after(); }; list.append(bt); });
  allEl.querySelector('.mkx').onclick=()=>{allEl.remove();allEl=null;};
  document.body.append(allEl);
}
addEventListener('keydown',e=>{if(e.key==='Escape')closeMenus();});
</script></body></html>
